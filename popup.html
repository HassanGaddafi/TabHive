<!doctype html>
<html><head><meta charset="utf-8"><title>TabHive</title><link rel="stylesheet" href="app.css">
<style>
body{width:340px;padding:18px;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}.top b{flex:1;font-size:16px}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:20px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.tick{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;background:#22c55e;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.tick.info{background:var(--accent)}.tick.warn{background:#f59e0b}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.msg{font-weight:700;font-size:17px}
.site{display:flex;gap:10px;align-items:center;max-width:100%;padding:8px 12px;border-radius:12px;background:var(--bg)}
.site img{width:30px;height:30px;border-radius:8px}.site div{min-width:0;text-align:start}
.site b,.site small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}.site small{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;color:var(--muted)}.grp select{margin:0;padding:6px 8px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}.btns button{padding:10px}
</style></head>
<body>
<div class="top"><span class="logo">▦</span><b>TabHive</b></div>
<div class="res"><div class="tick" id="tick">✓</div><div class="msg" id="msg"></div>
  <div class="site" id="site" hidden><img id="ico" alt=""><div><b id="ttl"></b><small id="hst"></small></div></div>
  <label class="grp" id="grpRow" hidden><span id="grpLbl"></span><select id="grp"></select></label></div>
<div class="btns"><button class="primary" id="open"></button><button id="all"></button></div>
<script src="common.js"></script><script src="popup.js"></script>
</body></html>
